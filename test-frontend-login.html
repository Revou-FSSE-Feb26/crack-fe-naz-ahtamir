<!DOCTYPE html>
<html>
<head>
    <title>Test Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #f15a22;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #d14519;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Test Login API</h1>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="idKaryawan">ID Karyawan:</label>
            <input type="text" id="idKaryawan" value="82400945" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" value="82400945K3" required>
        </div>
        
        <button type="submit">Test Login</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        const API_URL = 'http://localhost:3001/api';
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const idKaryawan = document.getElementById('idKaryawan').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = '<div style="color: #666;">Logging in...</div>';
            
            try {
                console.log('Sending request to:', `${API_URL}/auth/login`);
                console.log('Payload:', { idKaryawan, password });
                
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ idKaryawan, password }),
                });
                
                console.log('Response status:', response.status);
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <strong>✅ LOGIN SUCCESS!</strong><br><br>
                            <strong>User:</strong><br>
                            ID: ${data.user.idKaryawan}<br>
                            Nama: ${data.user.nama}<br>
                            Role: ${data.user.role}<br>
                            Departemen: ${data.user.departemen || 'N/A'}<br><br>
                            <strong>Token:</strong><br>
                            ${data.token.substring(0, 100)}...
                        </div>
                    `;
                    
                    // Store token
                    localStorage.setItem('smk3_token', data.token);
                    console.log('Token stored in localStorage');
                    
                } else {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <strong>❌ LOGIN FAILED!</strong><br><br>
                            Status: ${response.status}<br>
                            Message: ${data.message || 'Unknown error'}<br>
                            Error: ${data.error || 'N/A'}
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `
                    <div class="result error">
                        <strong>❌ REQUEST ERROR!</strong><br><br>
                        ${error.message}<br><br>
                        <small>Check console for details</small>
                    </div>
                `;
            }
        });
        
        // Check if token exists
        window.addEventListener('load', () => {
            const token = localStorage.getItem('smk3_token');
            if (token) {
                console.log('Existing token found:', token.substring(0, 50) + '...');
            } else {
                console.log('No existing token');
            }
        });
    </script>
</body>
</html>
